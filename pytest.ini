; Root pytest config. The python lane lives in `python/` and has its own
; `[tool.pytest.ini_options]` in `python/pyproject.toml`; pytest picks whichever config sits at the
; rootdir for the invocation, so running `pytest` FROM THE REPO ROOT read no config at all and
; collected the three `@pytest.mark.cowork` tests — each one spawns node, Docker and a real model.
;
; This is the config half of that fix. The other half lives in `python/cowork_harness.py`
; (`lane_opted_in` + the collection hook + the fixture guard) and is the primary one: INI config does
; not travel with an installed helper, so a consumer's bare `pytest` is protected only by the module.
[pytest]
markers =
    cowork: opt-in lane — drives the cowork-harness (spawns node + Docker). Select with `-m cowork`; deselect in the fast loop with `-m 'not cowork'`.
addopts = -m 'not cowork'
