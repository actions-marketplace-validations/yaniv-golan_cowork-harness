# yaml-language-server: $schema=../../schema/scenario.schema.json
# LIVE PROBE — the host-loop sub-agent folder manifest (Desktop >= 1.46388.3).
#
# WHY THIS EXISTS. Desktop 1.46388.3 replaced the host-loop sub-agent append and split it into three
# parts: the overridable `## Cowork environment` section, a host-loop-only folder manifest built from
# live mount state, and a trailing sentence. The harness composes all three
# (`src/prompt/subagent-manifest.ts`). Unit tests prove the harness renders what we AUTHORED; they
# cannot prove a sub-agent can act on it. Nothing in the live lane reads a sub-agent's environment back,
# so this part of the release shipped with no live coverage.
#
# WHAT THIS PROBE MEASURES, AND WHAT IT DELIBERATELY DOES NOT.
#
# The manifest's load-bearing claim is a SPLIT: the file tools take the HOST path listed for each folder
# (and reject `/sessions/` paths), the shell takes `<vmCwd>/mnt/<name>/`. Since Desktop 2.7032.0 it tells
# the sub-agent to pass ABSOLUTE paths to the file tools; it no longer says where a relative path resolves,
# so this probe no longer tests one.
#
# The obvious probe — ask the sub-agent to report the two path strings and assert on them — is
# WORTHLESS, and an earlier draft of this file made exactly that mistake. Both strings are sitting
# verbatim in the sub-agent's own system-prompt append, so a sub-agent that reads nothing and copies
# its environment section passes. That grades the harness's renderer against itself, which is what the
# unit tests already do. Those assertions were removed rather than weakened.
#
# What is asserted instead is CAUSAL — outcomes a recitation cannot fake:
#   * a sub-agent delivered its note through a file tool at the outputs folder's HOST path (non-error
#     result), and no file tool was ever sent a `/sessions/` path. The user asks for the "outputs
#     folder" by name only, so the path has to be resolved from a folder list, not copied from the prompt;
#   * both tool families were actually invoked (`Read`, and hostloop's shell `mcp__workspace__bash`);
#   * the total is right, so the ledger was really read and summed rather than guessed.
#
# HONEST LIMITS, stated so nobody reads more into a green than it carries. (1) This proves the manifest is
# ACTIONABLE — a sub-agent given it reaches the right files through both tool families. It does not
# prove our paraphrase matches Desktop's wording. (2) The parent sees its own copy of these paths and may
# spell the outputs path out in its dispatch prompt; a green then shows the sub-agent USED the host path,
# not where it learned it. Read the dispatch prompt in result.json's `subagents[].prompt` to tell which. That is the `manifest`/`suffix` fingerprint axes'
# job (`baselines/prompts/cowork-system-prompt-fingerprints.json`), and they hash production's own text.
#
# Run: cowork-harness run examples/scenarios/subagent-manifest-probe.yaml
# Not recorded as a fixture: host-loop recordings inherit the host environment (docs/maintenance.md).
baseline: latest
session: ../sessions/subagent-manifest-probe.yaml
fidelity: hostloop # the manifest is hostLoopMode-gated in production; no other tier composes it

prompt: |
  The folder I've attached has a ledger.csv in it. I've been bitten by a bad total before, so I'd like
  it checked twice over, independently.

  Please hand this to a sub-agent and have it:
    1. read ledger.csv and add up the amount column;
    2. re-derive the same total with a shell command, without reusing the first result;
    3. save a one-line note recording the total, as manifest-probe-check.md in the outputs folder.

  Then tell me the total and whether the two methods agreed.

# No `answers:` — deliberately, and this is not an oversight. The latest baseline pre-approves
# Task/Read/Glob/Grep via `spawn.allowedTools`, and hostloop's shell is the session-wide pre-approved
# `mcp__workspace__bash` (the `Bash` builtin is in hostloop's `disallowed` list and does not exist at
# this tier). So no `can_use_tool` gate fires for anything this probe needs, and scripted answers would
# be inert rules that read as protection while connecting to nothing.

assert:
  - result: success
  # The manifest is composed only for a sub-agent, so a run without one grades nothing about it.
  - subagent_dispatched: "."
  # Cost guard: Opus at effort:high, and the prompt asks for doubled work.
  - dispatch_count_max: 3

  # --- CAUSAL: file tools take the manifest's HOST path, never a /sessions/ one ---
  # A SUB-AGENT write ending in /outputs/manifest-probe-check.md returned a non-error result. A bare
  # relative write or a write into the attached folder fails it, and a VM path is rejected by the file
  # tool, so it fails too. The leading slash matters: without it a bare `manifest-probe-check.md` would
  # satisfy the suffix. (Not `subagent_dispatch_healthy`: with no `type` it requires EVERY dispatch to
  # deliver, so a legitimate one-sub-agent-per-method split would fail it.)
  - subagent_file_write: { path_suffix: "/outputs/manifest-probe-check.md" }
  # …and no file tool was sent a /sessions/ path at all.
  - no_vm_path_file_op: true
  # The suffix cannot name THIS session's outputs folder (its host path is per-run), so the file must
  # also be on disk there.
  - file_exists: outputs/manifest-probe-check.md

  # --- CAUSAL: both tool families really ran ---
  - subagent_tool_used: "Read"
  - subagent_tool_used: "mcp__workspace__bash"

  # --- CAUSAL: the ledger was really read and summed (12040+9317+15602+11254) ---
  - subagent_output_contains: { contains: "48213" }
