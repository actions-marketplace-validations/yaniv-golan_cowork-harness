name: Bug report
description: Something doesn't work as documented
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran and what went wrong.
      placeholder: "cowork-harness run scenarios/x.yaml → ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Harness version
      description: Output of `cowork-harness --version` (and whether it's an npm install or a source checkout).
      placeholder: "3.6.0 (npm -g)"
    validations:
      required: true
  - type: dropdown
    id: fidelity
    attributes:
      label: Fidelity tier
      options: [protocol, container, microvm, hostloop, cowork, "n/a"]
    validations:
      required: true
  - type: input
    id: baseline
    attributes:
      label: Platform baseline
      description: Which baselines/desktop-*.json (and your Desktop app version if relevant)
      placeholder: "desktop-2.2553.1 / app 2.2553.1 / agent 2.1.275"
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS + arch, Node version, Docker/Podman version, container runtime.
      placeholder: "macOS 15 arm64, Node 22.13, Docker 27, ..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / run artifacts
      description: Relevant lines from runs/<name>/<id>/ (turns/<N>/result.json, egress.log) or console output.
      render: shell
